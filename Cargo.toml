[workspace]
members = ["node", "python", "wasm"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "anydoc"
version = "0.1.7"
edition = "2024"
# Edition 2024 needs 1.85; zip and calamine both raise it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE"]

[dev-dependencies]
insta = "1"
serde_json = "1"
sha2 = "0.11"

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "0.1.7"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# serde backs the `json` feature; derives only, so the default build never
# pulls it in.
serde = { version = "1", features = ["derive"], optional = true }
# JSON parsing for the cloud OCR backends' responses (mistral, softnix).
serde_json = { version = "1", optional = true }

[features]
default = []
# The built-in Tesseract backend. The OcrEngine trait and page rendering are
# always available, so a custom or cloud backend needs no feature flag.
# Requires: `brew install tesseract` (macOS) or `apt install tesseract-ocr` (Linux).
ocr-tesseract = []
# Mistral OCR cloud backend (MISTRAL_API_KEY). Pulls serde_json for response
# parsing. Requires `curl` on PATH at runtime.
ocr-mistral = ["dep:serde_json"]
# Softnix OCR cloud backend (SOFTNIX_OCR_BASE_URL + SOFTNIX_OCR_TOKEN).
# Job-based API; polls until completed. Requires `curl` on PATH at runtime.
ocr-softnix = ["dep:serde_json"]
# Serialize the document model to JSON (serde `Serialize` derives).
json = ["dep:serde"]

[profile.release]
lto = "thin"
strip = "symbols"
